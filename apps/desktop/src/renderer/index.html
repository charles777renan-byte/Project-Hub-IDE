<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Mesma política de src/main/security.ts, sem frame-ancestors (só vale no cabeçalho). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'"
    />
    <title>Project Hub</title>
    <!--
      Os estilos são arquivos ligados por <link>, nunca importados por módulo TS: em desenvolvimento
      o Vite transformaria o CSS importado em <style>, que a CSP (style-src 'self') bloqueia.
    -->
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/xterm.css" />
    <link rel="stylesheet" href="./styles/app.css" />
    <link rel="stylesheet" href="./styles/home.css" />
    <link rel="stylesheet" href="./styles/plan.css" />
    <link rel="stylesheet" href="./styles/orchestrator-board.css" />
    <link rel="stylesheet" href="./styles/statusbar.css" />
    <link rel="stylesheet" href="./styles/project.css" />
    <link rel="stylesheet" href="./styles/mission.css" />
    <link rel="stylesheet" href="./styles/progress.css" />
    <link rel="stylesheet" href="./styles/workspace.css" />
    <link rel="stylesheet" href="./styles/motion.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
