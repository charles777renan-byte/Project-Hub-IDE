# Integração contínua do Project Hub. Só Windows por enquanto (ADR 0007, Tarefa 12.4): macOS e
# Linux entram quando o port for feito, e então este arquivo ganha uma matriz.
#
# O E2E (`pnpm test:e2e`) NÃO roda aqui: ele fica para a branch de release (especificação, 20.5).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o job só lê o código. Sem segredos e sem `pull_request_target`.
permissions:
  contents: read

# Uma nova execução da mesma ref cancela a anterior, que ficou obsoleta.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Windows (lint, tipos, testes, build)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Ações oficiais fixadas pelo SHA do commit; o comentário traz a tag correspondente.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A versão do pnpm vem do campo `packageManager` do package.json (pnpm@12.14.0).
      # Fica antes do setup-node, que precisa do pnpm no PATH para configurar o cache.
      - name: Instalar o pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # A versão do Node vem do .nvmrc (24.22.0, a mesma que o Electron 44.9.0 embute).
      - name: Instalar o Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar as dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Testes de integração
        run: pnpm test:integration

      - name: Build
        run: pnpm build
