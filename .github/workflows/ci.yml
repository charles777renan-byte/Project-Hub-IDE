# Integração contínua do Project Hub. Só Windows por enquanto (ADR 0007, Tarefa 12.4): macOS e
# Linux entram quando o port for feito, e então este arquivo ganha uma matriz.
#
# O E2E (`pnpm test:e2e`) NÃO roda aqui: ele fica para a branch de release (especificação, 20.5).
#
# Os jobs rodam em paralelo: qualidade (lint, tipos e build), três partes dos testes unitários e os testes de
# integração. Cada job instala as dependências por conta própria (o cache do pnpm deixa isso rápido). Os unitários
# são divididos com `--shard`, porque é o passo mais longo no runner do Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o job só lê o código. Sem segredos e sem `pull_request_target`.
permissions:
  contents: read

# Uma nova execução da mesma ref cancela a anterior, que ficou obsoleta.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  qualidade:
    name: Windows (lint, tipos, build)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Ações oficiais fixadas pelo SHA do commit; o comentário traz a tag correspondente.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A versão do pnpm vem do campo `packageManager` do package.json (pnpm@12.14.0).
      # Fica antes do setup-node, que precisa do pnpm no PATH para configurar o cache.
      - name: Instalar o pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # A versão do Node vem do .nvmrc (24.22.0, a mesma que o Electron 44.9.0 embute).
      - name: Instalar o Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar as dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  testes-unitarios:
    name: Windows (testes unitários, parte ${{ matrix.parte }} de 3)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar o Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar as dependências
        run: pnpm install --frozen-lockfile

      # `--shard` reparte os arquivos de teste entre as três partes; juntas, rodam todos.
      - name: Testes unitários (parte ${{ matrix.parte }} de 3)
        run: pnpm test --shard=${{ matrix.parte }}/3

  testes-integracao:
    name: Windows (testes de integração, parte ${{ matrix.parte }} de 3)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar o Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar as dependências
        run: pnpm install --frozen-lockfile

      # Cada parte roda numa máquina virtual própria, então as partes não dividem pasta, banco nem pipe. Dentro
      # de uma parte os arquivos seguem em série (`--no-file-parallelism`), como antes. Quais arquivos entram em
      # cada parte está em `vitest.partes-integracao.ts`, equilibrado pelo tempo (o `--shard` padrão não olha isso).
      - name: Testes de integração (parte ${{ matrix.parte }} de 3)
        run: pnpm test:integration --shard=${{ matrix.parte }}/3
